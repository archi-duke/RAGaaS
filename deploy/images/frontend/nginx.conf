# RAGaaS frontend — MF remote 정적 서빙 (게이트웨이 /ragaas/ 뒤, 프리픽스는 게이트웨이가 strip)
# 브라우저 API 호출 경로: /ragaas/api/* → 게이트웨이가 ragaas-backend:8000 직결 (이 nginx 미경유)
#                         /ragaas/ingest-api/* → 게이트웨이 /ragaas/ → 여기 → ingest-service 프록시
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript;

    # Ingest Service 프록시 (/ingest-api/ → ingest-service:8001/api/)
    location /ingest-api/ {
        proxy_pass http://ingest-service:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100M;
    }

    # SPA fallback (graph-viewer 팝업 등 딥링크)
    # index.html 은 절대 캐시 금지: 캐시되면 옛 mf-entry-bootstrap/청크 참조가 고착돼
    # 신 배포가 반영되지 않는다 (부트스트랩 해시 변경 미인지 → standalone/MemoryRouter 불일치).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS: 항상 재검증(no-cache). MF 의 remoteEntry.js / loadShare 청크는 파일명이
    # 배포 간 안정적이라 immutable 캐시 시 브라우저가 옛 청크를 재사용 → 신 배포 미반영
    # (React 18→19 전환 때 ReactCurrentOwner 크래시로 실측). no-cache = 매 사용 전 304 재검증.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 이미지/폰트: 콘텐츠 해시 파일명 → 장기 캐시 안전
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
